<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAC·ZIG</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #000; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 14px;
    gap: 12px;
    background: #000;
  }
  #hud {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.05em;
    color: #E4E7F0;
    display: flex;
    gap: 22px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
  }
  #hud .stat { display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
  #hud .lbl { color: #9EA4B8; font-size: 9px; margin-bottom: 2px; }
  #game {
    image-rendering: pixelated;
    border: 1px solid #1A1A4D;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-family: 'JetBrains Mono', monospace;
    color: #FFFF00;
    text-align: center;
    background: rgba(0, 0, 0, 0.72);
    pointer-events: none;
  }
  #overlay.hidden { display: none; }
  #overlay .title { font-size: 32px; font-weight: 700; margin: 0; letter-spacing: 0.06em; }
  #overlay .sub { font-size: 13px; color: #9EA4B8; margin: 0; }
  #overlay .start { font-size: 14px; color: #3B4CFF; margin: 0; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0.35; } }
</style>
</head>
<body>
  <div id="hud"></div>
  <canvas id="game"></canvas>
  <div id="overlay"></div>

  <script src="pacman.js"></script>
  <script>
    // initial overlay (pac.js sets one for the ready phase); this guards
    // the case where the DOM hasn't been populated yet at load time.
    window.addEventListener("load", () => {
      const overlay = document.getElementById("overlay");
      if (overlay.innerHTML === "") showOverlay("PAC·ZIG", "native 31x28 maze, arrow keys / WASD");
    });
  </script>
</body>
</html>
